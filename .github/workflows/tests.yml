name: tests

# No microphone, no GPU, no running Ollama and no internet during the tests.
# The whole hardware and network layer is replaced with fakes
# (tests/conftest.py), so the same suite passes on a CI machine and on a
# laptop — see the "Tests" section in the README.
#
# NOTE: green tests prove the LOGIC is correct, not that the assistant will work
# on a particular piece of hardware. CI will not check the microphone, the sound
# driver or the CUDA version. That is what `python main.py --check-deps` run on
# your own machine is for.

on:
  push:
    branches: [main, master]
  pull_request:
  # Manual runs from the Actions tab — useful after a change to CI itself.
  workflow_dispatch:

# A new push to the same branch cancels the previous run. Without this, a series
# of commits fills the queue with runs nobody will read the result of.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      # One failing combination must not kill the others: we want to know
      # whether the problem affects one system or all of them.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      # Checking that EVERY module imports on its own. This catches circular
      # imports and typos in names that unit tests may never touch, because they
      # import only what they happen to use.
      - name: Imports
        shell: bash
        run: |
          python - <<'PY'
          import importlib
          import sys
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str(root))
          bledy = []
          moduly = []
          for path in sorted(root.rglob("*.py")):
              parts = path.relative_to(root).parts
              if any(p in {".venv", "__pycache__", "tests", "scripts", ".git"} for p in parts):
                  continue
              name = ".".join(path.relative_to(root).with_suffix("").parts)
              name = name.removesuffix(".__init__")
              moduly.append(name)
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  bledy.append(f"{name}: {type(exc).__name__}: {exc}")

          print(f"checked {len(moduly)} modules")
          for blad in bledy:
              print(f"  ERROR {blad}")
          raise SystemExit(1 if bledy else 0)
          PY

      - name: Tests
        # No `.env` — the tests must be independent of machine configuration,
        # and on CI no such file exists anyway. If some test needed one, that
        # would be a bug in the test, not in the environment.
        run: python -m pytest -q

      # The dependency report is NOT a gate: CI has no microphone, no Ollama
      # and no models, so exit code 1 is normal here. We run it because it
      # exercises the whole detection layer on a real system — and that is the
      # only place where a failure of that layer on Windows becomes visible.
      - name: Environment detection (informational)
        continue-on-error: true
        run: python main.py --check-deps

  quality:
    name: ruff + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      # Both analyses have a NON-ZERO baseline in this project: ruff reports
      # ~430 findings (mostly deliberately lazy imports of the hardware layers),
      # mypy has findings in the tests. Hence `continue-on-error`: the result is
      # there to be READ, not to block a PR. The gate is pytest.
      #
      # Should the baseline ever reach zero, simply delete `continue-on-error`
      # from both steps.
      - name: ruff
        continue-on-error: true
        run: python -m ruff check --output-format=github .

      - name: mypy
        continue-on-error: true
        run: python -m mypy .
